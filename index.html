<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wang Jun</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 640px;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #f0f6fc; }
    .subtitle { font-size: 1.1rem; color: #8b949e; margin-bottom: 2rem; }
    .tech-stack { margin-bottom: 2rem; }
    .tech-stack span {
      display: inline-block;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 999px;
      padding: 0.4rem 1rem;
      margin: 0.3rem;
      font-size: 0.9rem;
      color: #58a6ff;
    }
    .links a {
      display: inline-block;
      margin: 0 0.5rem;
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Hi, I'm Wang Jun 👋</h1>
    <p class="subtitle">Developer · Builder · Lifelong Learner</p>
    <div class="tech-stack">
      <span>Java</span>
      <span>React</span>
      <span>Python</span>
      <span>AI</span>
      <span>Web3</span>
    </div>
    <div class="links">
      <a href="https://github.com/wangjuns">GitHub</a>
      <a href="projects/">Projects</a>
    </div>
  </div>
</body>
</html>
